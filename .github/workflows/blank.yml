name: Metrics and AniList Favorites

on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push:
    branches:
      - master
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      # Step 1: Generate GitHub Metrics + AniList Metrics (Anime, Manga, and Characters)
      - name: Generate GitHub and AniList Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: all_metrics.svg
          
          # GitHub Metrics
          github: yes
          
          # AniList Plugin Configuration
          plugin_anilist: yes
          plugin_anilist_user: Duke8  # Replace with your AniList username
          plugin_anilist_medias: anime,manga  # Both anime and manga
          plugin_anilist_sections: favorites,watching,reading,characters  # Include favorites, watching, reading, characters
          plugin_anilist_limit: 5  # Limit to 5 items for each section
          plugin_anilist_limit_characters: 5  # Limit to 5 characters displayed
          plugin_anilist_shuffle: yes  # Shuffle data for variety (optional)
