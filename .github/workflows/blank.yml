name: Metrics, Steam and AniList Favorites

on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push:
    branches:
      - master
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      # Step 1: Generate GitHub Metrics + Steam Metrics + AniList Metrics (Anime, Manga, and Characters)
      - name: Generate GitHub, Steam and AniList Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: all_metrics.svg
          
          # GitHub Metrics
          github: yes
          
          plugin_isocalendar: yes
          
          # Steam Plugin Configuration
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}  # Your Steam API token
          plugin_steam_user: "76561198404562076"  # Your Steam user ID
          plugin_steam_sections: player, recently-played
          plugin_steam_recent_games_limit: 3  # Display the 3 most recently played games
          
          # AniList Plugin Configuration
          plugin_anilist: yes
          plugin_anilist_user: Duke8  # Replace with your AniList username
          plugin_anilist_medias: manga  # Show manga (can include anime as well)
          plugin_anilist_sections: reading,characters  # Include reading and characters
          plugin_anilist_limit: 2  # Limit to 2 items for each section
          plugin_anilist_limit_characters: 10  # Limit to 10 characters displayed
          plugin_anilist_shuffle: yes  # Shuffle data for variety (optional)
